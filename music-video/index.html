<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>复刻回忆·纸上记忆</title><style>
*{box-sizing:border-box}body{margin:0;background:#202530;color:#f5e7d1;font:14px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(100%,1080px);padding:16px}h2{font-weight:400;letter-spacing:.2em}canvas{width:100%;height:auto;display:block;border:1px solid #887b6b;border-radius:10px;box-shadow:0 18px 55px #0008}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0}button,label{background:#3b4656;color:#fff0dc;border:1px solid #778394;border-radius:7px;padding:8px 12px}input[type=file]{display:none}input[type=range]{flex:1;min-width:100px}</style><main><h2>复刻回忆 · 纸上记忆</h2><canvas id="v" width="1280" height="720"></canvas><div class="bar"><button id="toggle">暂停</button><button id="again">重播</button><span id="time">00:00 / 00:30</span><input id="seek" type="range" min="0" max="30" step=".05"><label for="lrc">导入 LRC</label><input id="lrc" type="file" accept=".lrc,.txt"></div><small id="note">30 秒无声动画预览；可载入本地 LRC 时间轴字幕。</small></main>
<script>
(()=>{const c=document.querySelector('#v'),g=c.getContext('2d'),seek=document.querySelector('#seek'),time=document.querySelector('#time'),toggle=document.querySelector('#toggle');let t=0,run=true,last=0,subs=[];
const clamp=(v)=>Math.max(0,Math.min(1,v)),ease=v=>{v=clamp(v);return v*v*(3-2*v)};
function rect(x,y,w,h,col,rot=0){g.save();g.translate(x,y);g.rotate(rot);g.shadowColor='#55483c55';g.shadowBlur=12;g.shadowOffsetY=7;g.fillStyle=col;g.fillRect(-w/2,-h/2,w,h);g.restore()}
function dot(x,y,r,col){g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=col;g.fill()}
function label(s,x,y,size,col){g.font='500 '+size+'px "Microsoft YaHei",sans-serif';g.textAlign='center';g.fillStyle=col;g.fillText(s,x,y)}
function poly(a,col){g.beginPath();a.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fillStyle=col;g.fill()}
function draw(){let sky=g.createLinearGradient(0,0,1280,720);sky.addColorStop(0,'#eadcc3');sky.addColorStop(1,'#aebfba');g.fillStyle=sky;g.fillRect(0,0,1280,720);
g.fillStyle='#d4c2a6';g.fillRect(0,0,1280,490);g.fillStyle='#8fa8a5';g.fillRect(800,70,350,300);g.strokeStyle='#f7ead3';g.lineWidth=16;g.strokeRect(800,70,350,300);g.beginPath();g.moveTo(975,70);g.lineTo(975,370);g.moveTo(800,220);g.lineTo(1150,220);g.stroke();
rect(640,535,940,350,'#70594a',-.02);rect(640,510,900,320,'#f6e9d2',-.02);g.strokeStyle='#c9b394';g.lineWidth=3;g.beginPath();g.moveTo(640,350);g.lineTo(640,670);g.stroke();
let city=ease((t-3)/5)*(1-ease((t-16)/5));for(let i=0;i<9;i++){let h=100+(i*53%160);rect(335+i*75,470-h/2,56,h,'#aab4ae',0)}
for(let i=0;i<35;i++){let xx=(i*173+Math.sin(t+i)*22)%1280,yy=(i*89)%330;dot(xx,yy,2+i%3,'rgba(255,247,220,'+(city*.7)+')')}
let bob=Math.sin(t*3)*5,cx=640+Math.sin(t*.7)*20;dot(cx-62,454+bob,44,'#e6b99e');dot(cx+55,449-bob,44,'#e2b49d');rect(cx-62,520+bob,85,100,'#8da1a0',-.08);rect(cx+55,515-bob,85,100,'#bd7770',.08);dot(cx-78,447+bob,5,'#59463d');dot(cx-46,447+bob,5,'#59463d');dot(cx+40,442-bob,5,'#59463d');dot(cx+70,442-bob,5,'#59463d');
if(t>7&&t<19){let bx=640+Math.sin(t)*100,by=470+Math.sin(t*2)*12;poly([[bx-90,by],[bx+90,by],[bx+55,by+35],[bx-60,by+35]],'#b87569');poly([[bx,by-110],[bx,by-5],[bx+75,by-5]],'#f4e4c8');poly([[bx-7,by-90],[bx-7,by-5],[bx-70,by-5]],'#91aaa5');}
if(t>10&&t<24){for(let i=0;i<10;i++){let xx=360+i*60,yy=600+Math.sin(t+i)*10;g.strokeStyle='#79916f';g.lineWidth=4;g.beginPath();g.moveTo(xx,665);g.lineTo(xx,yy);g.stroke();for(let k=0;k<5;k++){let a=k*1.256;dot(xx+Math.cos(a)*11,yy+Math.sin(a)*11,8,'#d98c83')}dot(xx,yy,5,'#e9c987')}}
if(t>18){g.strokeStyle='#b64f53';g.lineWidth=5;g.beginPath();g.moveTo(380,410);g.bezierCurveTo(500,300,780,610,900,410);g.stroke();for(let i=0;i<12;i++)dot(400+i*40,420+Math.sin(t+i)*18,3,'#b64f53')}
if(t>24){rect(640,510,400,235,'#fff2dc',-.03);label('那些熟悉的瞬间',640,500,29,'#956e60');label('仍然留在记忆里',640,545,21,'#956e60')}
if(t<3){label('复刻回忆',640,160,56,'#795e52');label('PAPER MEMORIES',640,198,17,'#8c7969')}
let s=subs.filter(a=>a.t<=t).slice(-1)[0];if(s){g.fillStyle='#29272bbd';g.fillRect(220,635,840,48);label(s.s,640,668,23,'#fff0dc')}
}
function frame(ms){if(!last)last=ms;let d=Math.min(.05,(ms-last)/1000);last=ms;if(run)t=Math.min(30,t+d);draw();seek.value=t;time.textContent='00:'+String(Math.floor(t)).padStart(2,'0')+' / 00:30';toggle.textContent=run&&t<30?'暂停':'播放';requestAnimationFrame(frame)}
toggle.onclick=()=>{if(t>=30)t=0;run=!run};document.querySelector('#again').onclick=()=>{t=0;run=true};seek.oninput=()=>{t=+seek.value;draw()};
document.querySelector('#lrc').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{subs=String(r.result).split(/\r?\n/).flatMap(line=>{let m=[...line.matchAll(/\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\]/g)],s=line.replace(/\[[^\]]+\]/g,'').trim();return m.map(a=>({t:+a[1]*60 + +a[2]+ +(a[3]||0)/1000,s}))}).filter(a=>a.s);document.querySelector('#note').textContent='已载入 '+subs.length+' 条字幕';draw()};r.readAsText(f)};
requestAnimationFrame(frame)})();
</script></body></html>
